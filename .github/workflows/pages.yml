# Puts the app on the open web, where the map can actually reach its tiles and
# the phone can actually install it.
#
# Nothing is published until Pages is switched on by hand — Settings → Pages →
# Source: GitHub Actions — and Pages only accepts deploys from the repository's
# default branch, so this branch has to be it. After that, every push to this
# branch redeploys, and the phone picks the new build up the next time it is
# opened. The Actions tab can also run it on demand.
#
# It serves the app at https://<you>.github.io/<repo>/, which is why the build
# is told its base.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/lvl100-fitness-gaming-app-u3sjz1
    # Nothing here changes the built app, so nothing here should redeploy it.
    paths-ignore:
      - 'tools/**'
      - '**/*.md'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
