<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay controls</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #141821;
        --line: rgba(255, 255, 255, 0.09);
        --text: #eef1f6;
        --muted: rgba(238, 241, 246, 0.55);
        --accent: #ff4655;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        padding: 32px 24px 64px;
        display: flex;
        justify-content: center;
      }
      .wrap { width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 20px; }
      h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
      .status { display: flex; align-items: center; gap: 10px; font-size: 14px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #666; flex-shrink: 0; }
      .dot.live { background: #35d08a; }
      .dot.offline { background: #ff5c72; }
      .muted { color: var(--muted); font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
      select, input[type='number'], input[type='text'] {
        background: #0e1117; color: var(--text); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px;
      }
      .checks { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
      .checks label { flex-direction: row; align-items: center; gap: 7px; color: var(--text); font-size: 13px; }
      .url { display: flex; gap: 8px; margin-top: 16px; }
      .url input { flex: 1; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; }
      button {
        background: var(--accent); color: #fff; border: 0; border-radius: 8px;
        padding: 9px 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
      button:active { transform: translateY(1px); }
      .preview { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background:
        repeating-conic-gradient(#1b1f29 0% 25%, #151922 0% 50%) 50% / 20px 20px; }
      iframe { width: 100%; height: 190px; border: 0; display: block; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>VALORANT rank overlay</h1>

      <div class="panel">
        <h2>Status</h2>
        <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
        <div class="row" style="margin-top: 16px">
          <button id="reset">Reset session record</button>
          <span class="muted" id="sessionInfo"></span>
        </div>
      </div>

      <div class="panel">
        <h2>Overlay URL</h2>
        <div class="grid">
          <label>Layout
            <select id="layout">
              <option value="bar">Bar (horizontal)</option>
              <option value="stack">Stacked (vertical)</option>
              <option value="mini">Mini</option>
            </select>
          </label>
          <label>Background
            <select id="bg">
              <option value="card">Card</option>
              <option value="none">None (text only)</option>
              <option value="solid">Solid</option>
            </select>
          </label>
          <label>Align
            <select id="align"><option value="left">Left</option><option value="right">Right</option></select>
          </label>
          <label>Record
            <select id="record"><option value="session">Session</option><option value="act">Act</option></select>
          </label>
          <label>Scale
            <input type="number" id="scale" value="1" min="0.5" max="3" step="0.1" />
          </label>
          <label>Recent games shown
            <input type="number" id="form" value="5" min="0" max="10" step="1" />
          </label>
        </div>
        <div class="checks">
          <label><input type="checkbox" value="rank" checked /> Rank + RR</label>
          <label><input type="checkbox" value="record" checked /> Record</label>
          <label><input type="checkbox" value="delta" checked /> Net RR</label>
          <label><input type="checkbox" value="form" checked /> Recent games</label>
        </div>
        <div class="url">
          <input type="text" id="url" readonly />
          <button id="copy">Copy</button>
        </div>
      </div>

      <div class="panel">
        <h2>Preview</h2>
        <div class="preview"><iframe id="preview" title="Overlay preview"></iframe></div>
        <p class="muted" style="margin-top: 12px">
          The checkerboard stands in for transparency — in OBS the background is see-through.
        </p>
      </div>
    </div>

    <script>
      const ids = ['layout', 'bg', 'align', 'record', 'scale', 'form']
      const inputs = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)]))
      const checks = [...document.querySelectorAll('.checks input')]
      const urlField = document.getElementById('url')
      const preview = document.getElementById('preview')

      function buildUrl() {
        const params = new URLSearchParams()
        for (const id of ids) {
          const value = inputs[id].value
          const isDefault =
            (id === 'layout' && value === 'bar') ||
            (id === 'bg' && value === 'card') ||
            (id === 'align' && value === 'left') ||
            (id === 'record' && value === 'session') ||
            (id === 'scale' && Number(value) === 1) ||
            (id === 'form' && Number(value) === 5)
          if (!isDefault) params.set(id, value)
        }
        const shown = checks.filter((c) => c.checked).map((c) => c.value)
        if (shown.length !== checks.length) params.set('show', shown.join(','))
        const query = params.toString()
        return `${location.origin}/overlay${query ? `?${query}` : ''}`
      }

      function sync() {
        const url = buildUrl()
        urlField.value = url
        preview.src = url
      }

      for (const node of [...Object.values(inputs), ...checks]) node.addEventListener('change', sync)
      document.getElementById('copy').addEventListener('click', async () => {
        await navigator.clipboard.writeText(urlField.value)
        const button = document.getElementById('copy')
        button.textContent = 'Copied'
        setTimeout(() => (button.textContent = 'Copy'), 1200)
      })
      document.getElementById('reset').addEventListener('click', async () => {
        await fetch('/api/session/reset', { method: 'POST' })
      })

      const dot = document.getElementById('dot')
      const status = document.getElementById('status')
      const sessionInfo = document.getElementById('sessionInfo')

      new EventSource('/events').onmessage = (event) => {
        const state = JSON.parse(event.data)
        dot.className = `dot ${state.connected ? 'live' : 'offline'}`
        status.textContent = state.connected
          ? `${state.mock ? 'Mock data · ' : ''}${state.player ? `${state.player.name}#${state.player.tag} · ` : ''}${state.rank.name} · ${state.rr} RR · ${state.status}`
          : state.error || 'Not connected'
        const { wins, losses, draws, startedAt } = state.session
        sessionInfo.textContent = `${wins}W ${losses}L${draws ? ` ${draws}D` : ''} since ${new Date(startedAt).toLocaleTimeString()}`
      }

      sync()
    </script>
  </body>
</html>
